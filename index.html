<!doctype html>
<html lang="ru" data-theme="light">
<head>

  <meta name="theme-color" content="#fff3d8">
  <title>Кондитерская</title>

    </header>

    <div class="ticker" aria-hidden="true"><div class="t"><span>ЗАКАЗЫ ✦ РЕЦЕПТЫ ✦ ТЕХКАРТЫ ✦ ДОХОДЫ ✦ ТОРТЫ ✦ НАЧИНКИ ✦ ДЕКОР ✦ ЗАКАЗЫ ✦ РЕЦЕПТЫ ✦ ТЕХКАРТЫ ✦ ДОХОДЫ ✦ ТОРТЫ ✦ НАЧИНКИ ✦ ДЕКОР ✦ </span><span>ЗАКАЗЫ ✦ РЕЦЕПТЫ ✦ ТЕХКАРТЫ ✦ ДОХОДЫ ✦ ТОРТЫ ✦ НАЧИНКИ ✦ ДЕКОР ✦ ЗАКАЗЫ ✦ РЕЦЕПТЫ ✦ ТЕХКАРТЫ ✦ ДОХОДЫ ✦ ТОРТЫ ✦ НАЧИНКИ ✦ ДЕКОР ✦ </span></div></div>

    <main id="view"></main>

    <nav class="tabs">
